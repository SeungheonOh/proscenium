<!doctype html>
<!--
  The gallery in a browser: the same sections, sizes, colours, radii, shadows and fonts as
  examples/gallery.tsx and sdk/src/ui/theme.ts, in plain DOM and CSS, for comparing how the
  compositor renders them with how a browser does. ?theme=dark shows the dark theme.
  Mirror the kit's tokens here, do not restyle: a change to theme.ts or a section belongs here too.
  Assumptions: a shadow's `blur` is CSS's blur radius; a gradient `angle: 0` runs left to right and 90 top to bottom.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Gallery reference</title>
<style>
:root {
  --ink: #17171a; --soft: #17171acc; --muted: #17171a99; --faint: #17171a4d; --inverse: #ffffff; --on-accent: #ffffff;
  --accent: #2f6fed; --accent-light: #5b8cff; --accent-hover: #2a64d8; --accent-press: #2559c2;
  --accent-soft: #2f6fed1a; --accent-soft-hover: #2f6fed29; --accent-soft-press: #2f6fed38; --accent-tint: #2f6fed24; --accent-line: #2f6fed59;
  --danger: #dc3d37; --hover: #0000000d; --press: #00000017; --line: #00000014; --border: #00000021; --border-hover: #00000033;
  --field: #ffffff; --field-hover: #f8f8f9; --track: #17171a17; --control: #17171a24; --control-hover: #17171a33;
  --knob: #ffffff; --raised: #ffffff; --glass: #ffffffd9; --card: #ffffffe6; --card-line: #00000014;
  --popover: #ffffff; --popover-line: #00000017; --selection: #2f6fed40; --ring: #2f6fed66;
  --shadow-control: 0 1px 2px #0000000d;
  --shadow-pill: 0 1px 2px #0000000f, 0 4px 10px -2px #00000024;
  --shadow-card: 0 1px 3px #0000000d, 0 4px 12px -2px #0000001a;
  --shadow-float: 0 1px 3px #00000014, 0 12px 24px -4px #00000029;
  --shadow-modal: 0 2px 4px #0000001a, 0 24px 48px -8px #00000038;
  --shadow-knob: 0 0 0 .5px #0000000f, 0 1px 3px #00000033;
  --glass-from: #ffffffee; --glass-to: #00000017;
  --page: #ecebe6; --panel: #f7f6f3;
  --font: "Noto Sans", sans-serif;
}
:root[data-theme="dark"] {
  --ink: #f2f2f5; --soft: #f2f2f5cc; --muted: #f2f2f599; --faint: #f2f2f552; --inverse: #17171a;
  --accent: #4a82ff; --accent-light: #7da5ff; --accent-hover: #5b8eff; --accent-press: #3f74ea;
  --accent-soft: #4a82ff29; --accent-soft-hover: #4a82ff3d; --accent-soft-press: #4a82ff4d; --accent-tint: #4a82ff33; --accent-line: #4a82ff80;
  --danger: #ff5a54; --hover: #ffffff12; --press: #ffffff1f; --line: #ffffff17; --border: #ffffff1f; --border-hover: #ffffff33;
  --field: #ffffff0d; --field-hover: #ffffff17; --track: #ffffff1f; --control: #ffffff2e; --control-hover: #ffffff3d;
  --knob: #f5f5f7; --raised: #4a4a52; --glass: #26262bd9; --card: #26262bf2; --card-line: #ffffff17;
  --popover: #2b2b30; --popover-line: #ffffff1c; --selection: #4a82ff59; --ring: #4a82ff80;
  --shadow-control: 0 1px 2px #00000033;
  --shadow-pill: 0 1px 2px #00000040, 0 4px 10px -2px #00000066;
  --shadow-card: 0 1px 3px #00000033, 0 4px 12px -2px #00000059;
  --shadow-float: 0 1px 3px #00000040, 0 12px 24px -4px #00000073;
  --shadow-modal: 0 2px 4px #0000004d, 0 24px 48px -8px #00000099;
  --shadow-knob: 0 0 0 .5px #00000026, 0 1px 3px #00000066;
  --glass-from: #ffffff38; --glass-to: #ffffff0d;
  --page: #121214; --panel: #1c1c20;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 800px; overflow: hidden; }
body { background: var(--page); font-family: var(--font); color: var(--ink); position: relative; }
div, span { display: flex; flex-direction: row; }
.col { flex-direction: column; }
.row { align-items: center; }
.abs { position: absolute; }
.nowrap { white-space: nowrap; }

/* text styles of the kit: body 13/500, strong 13/650, caption 12/650, title 15/650 */
.body { font: 400 13px/18px var(--font); color: var(--soft); white-space: nowrap; }
.label { font: 500 13px/18px var(--font); color: var(--ink); white-space: nowrap; }
.strong { font: 600 13px/18px var(--font); color: var(--ink); white-space: nowrap; }
.caption { font: 600 12px/16px var(--font); color: var(--ink); white-space: nowrap; }
.title { font: 600 15px/20px var(--font); letter-spacing: -.15px; color: var(--ink); white-space: nowrap; }
.t-ink { color: var(--ink); } .t-soft { color: var(--soft); } .t-muted { color: var(--muted); } .t-faint { color: var(--faint); }
.t-inverse { color: var(--inverse); } .t-on-accent { color: var(--on-accent); } .t-accent { color: var(--accent); } .t-danger { color: var(--danger); }
.note { font: 500 10px/normal var(--font); color: var(--muted); white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; display: block; }

/* the page */
#grid { position: absolute; left: 12px; top: 12px; width: 1256px; height: 776px; gap: 12px; align-items: flex-start; }
.column { flex: 1 1 0; height: 776px; flex-direction: column; gap: 12px; min-width: 0; }
.section { flex: 1 1 0; min-height: 0; flex-direction: column; gap: 8px; padding: 12px; overflow: hidden;
  background: var(--panel); border-radius: 12px; border: 1px solid var(--line); }
.section > h2 { font: 650 10px/16px var(--font); text-transform: uppercase; color: var(--ink); white-space: nowrap; display: block; }

/* kit: Button */
.btn { height: 28px; padding: 0 11px; gap: 6px; border-radius: 6px; border: 1px solid transparent; align-items: center; justify-content: center; }
.btn.small { height: 24px; padding: 0 7px; gap: 5px; border-radius: 6px; }
.btn.tinted { background: var(--accent-soft); } .btn.filled { background: var(--accent); box-shadow: inset 0 1px #ffffff26, var(--shadow-control); }
.btn.selected { border-color: var(--accent-line); background: var(--accent-tint) !important; box-shadow: none !important; }
.btn.disabled { opacity: .45; }
.btn .strong.t-accent, .btn .strong.t-on-accent { }
.ibtn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent; align-items: center; justify-content: center; }
.ibtn.selected { background: var(--accent-tint); border-color: var(--accent-line); } .ibtn.disabled { opacity: .45; }
.ico { display: block; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }

/* kit: Checkbox, Switch, Slider, SegmentedControl, ProgressBar, TextField */
.check { gap: 8px; align-items: center; }
.check.disabled { opacity: .45; }
.box { width: 16px; height: 16px; border-radius: 4px; align-items: center; justify-content: center; position: relative;
  background: var(--field); border: 1px solid var(--border); box-shadow: var(--shadow-control); }
.box.on { background: var(--accent); border: 1px solid var(--accent); box-shadow: none; }
.box .arm { position: absolute; height: 2px; border-radius: 1px; background: #fff; opacity: 0; }
.box.on .arm { opacity: 1; }
.switch { width: 32px; height: 18px; border-radius: 9px; padding: 2px; align-items: center; background: var(--control); justify-content: flex-start; }
.switch.on { background: var(--accent); justify-content: flex-end; } .switch.disabled { opacity: .45; }
.switch i { width: 14px; height: 14px; border-radius: 7px; background: var(--knob); box-shadow: var(--shadow-knob); display: block; }
.slider { position: relative; width: 160px; height: 20px; }
.slider .rail { position: absolute; left: 0; top: 8px; width: 160px; height: 4px; border-radius: 2px; background: var(--track); }
.slider .fill { position: absolute; left: 0; top: 8px; height: 4px; border-radius: 2px; background: var(--accent); }
.slider .thumb { position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: var(--knob); box-shadow: var(--shadow-knob); }
.segments { padding: 2px; border-radius: 8px; background: var(--hover); align-self: stretch; position: relative; }
.segments .seg { height: 24px; padding: 0 12px; border-radius: 6px; align-items: center; justify-content: center; position: relative; }
.segments .seg .label { color: var(--muted); }
.segments .seg.on { background: var(--raised); box-shadow: 0 1px 2px #00000014, 0 0 0 .5px #0000000d; }
.segments .seg.on .label { color: var(--ink); }
.progress { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; align-self: stretch; }
.progress i { display: block; height: 6px; border-radius: 3px; background: var(--accent); }
.field { width: 220px; height: 28px; padding: 5px 8px; border-radius: 6px; background: var(--field); border: 1px solid var(--border); box-shadow: var(--shadow-control); }
.field .body { color: var(--faint); }

/* kit: Badge, Pill, Surface, Divider */
.badge-dot { width: 8px; height: 8px; border-radius: 4px; }
.badge { height: 18px; min-width: 18px; padding: 0 5px; border-radius: 9px; align-items: center; justify-content: center; font: 650 11px/16px var(--font); }
.bg-accent { background: var(--accent); color: var(--on-accent); } .bg-ink { background: var(--ink); color: var(--inverse); }
.bg-danger { background: var(--danger); color: var(--on-accent); } .bg-muted { background: var(--faint); color: var(--ink); }
.pill { align-items: center; padding: 0 14px; gap: 7px; height: 28px; border-radius: 14px; }
.pill.s24 { height: 24px; border-radius: 12px; padding: 0 12px; gap: 6px; }
.s-card { background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow-card); }
.s-ink { background: var(--ink); box-shadow: var(--shadow-pill); }
.s-accent { background: var(--accent); box-shadow: var(--shadow-pill); }
.s-glass { position: relative; background: var(--glass); backdrop-filter: blur(22px); box-shadow: var(--shadow-float); border: 1px solid transparent; }
.s-glass::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 1px solid transparent; pointer-events: none;
  background: linear-gradient(180deg, var(--glass-from), var(--glass-to)) border-box;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.tile { width: 78px; height: 46px; border-radius: 12px; align-items: center; justify-content: center; }
.hr { height: 1px; align-self: stretch; background: var(--line); margin: 4px 0; }
.vr { width: 1px; background: var(--line); margin: 0 4px; align-self: stretch; }

/* scroll */
.scroll { flex: 1 1 0; min-height: 0; border-radius: 8px; background: var(--card); border: 1px solid var(--card-line); overflow: hidden; flex-direction: column; }
.scroll .item { height: 30px; padding: 0 10px; gap: 8px; align-items: center; flex: none; }
.scroll .rule { height: 1px; background: var(--line); flex: none; }

.tray .note { color: #17171a99; }
/* raw states */
.sx-fill:hover { background: #3b5bdb !important; } .sx-fill:active { background: #2b46a6 !important; }
.sx-all:hover { border-color: #2f6fed !important; box-shadow: 0 6px 14px #00000040 !important; transform: scale(1.05); }
.sx-all:active { transform: scale(.95); box-shadow: 0 0 2px #00000014 !important; }
.sx-group:hover { background: #2f6fed !important; border-color: #2f6fed !important; } .sx-group:active { background: #2457c4 !important; }
.sx-group:hover span { color: #fff !important; }
.sx-tab:focus-visible { border-color: #ffd43b !important; outline: none; } .sx-tab:hover { background: #2a2d34 !important; }
.sx-focus:focus { border-color: #2f6fed !important; outline: none; }
.sx-press:active { transform: scale(.9); opacity: .7; }
.sx-lift:hover { box-shadow: 0 10px 18px -4px #00000055 !important; transform: translateY(-3px); }


/* page 3: kit components at rest */
.tabs { gap: 4px; border-bottom: 1px solid var(--line); position: relative; align-self: stretch; }
.tabs .tab { height: 36px; padding: 0 10px; border-radius: 6px; align-items: center; position: relative; }
.tabs .tab .label { color: var(--muted); } .tabs .tab.on .label { color: var(--ink); }
.tabs .tab.on::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; border-radius: 1px; background: var(--accent); }
.lrow { min-height: 32px; padding: 4px 8px; gap: 10px; border-radius: 6px; align-items: center; align-self: stretch; }
.lrow.on { background: var(--accent-soft); } .lrow.off { opacity: .45; }
.lrow .texts { flex: 1 1 0; flex-direction: column; min-width: 0; }
.small { font: 400 12px/16px var(--font); color: var(--muted); white-space: nowrap; }
.sel { height: 28px; padding: 0 6px 0 10px; gap: 6px; border-radius: 6px; background: var(--field); border: 1px solid var(--border); box-shadow: var(--shadow-control); align-items: center; flex: none; }
.sel.s24 { height: 24px; padding: 0 4px 0 8px; } .sel.s32 { height: 32px; } .sel.off { opacity: .45; }
.sel .body { flex: 1 1 0; color: var(--ink); } .sel .body.ph { color: var(--faint); }
.ibtn.outl { background: var(--field); border-color: var(--border); box-shadow: var(--shadow-control); }
.btn.outline { background: var(--field); border-color: var(--border); box-shadow: var(--shadow-control); }
.tf { width: 300px; padding: 5px 8px; border-radius: 6px; background: var(--field); border: 1px solid var(--border); box-shadow: var(--shadow-control); flex-direction: column; }
.tf .body { color: var(--ink); } .tf.empty .body { color: var(--faint); } .tf.off { opacity: .45; }
.tf.half { width: 146px; } .tf.clip { overflow: hidden; white-space: nowrap; }
.tf.row { flex-direction: row; align-items: center; gap: 4px; } .tfmark { color: var(--muted); font-size: 13px; width: 14px; }
.tf.focus { border-color: var(--accent); box-shadow: var(--shadow-control), 0 0 0 3px var(--ring); }
.ctxcard { width: 360px; height: 70px; border-radius: 12px; background: var(--hover); border: 1px dashed var(--border); align-items: center; justify-content: center; }

/* toast */
#toast { position: absolute; left: 0; width: 1280px; top: 700px; justify-content: center; }
#toast .pill { height: 48px; border-radius: 24px; padding: 0 20px; gap: 14px; }
#toast .dot { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); }
</style>
</head>
<body>
<div id="grid"></div>
<div class="abs" style="left:430px;top:700px" id="toast-busy"></div>
<div id="toast"><div class="pill s-glass"><div class="dot"></div><span class="strong">Magnet</span><span class="body t-muted">On · Firm</span></div></div>
<script>
const theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
document.documentElement.dataset.theme = theme;
const only = new URLSearchParams(location.search).get("section");

const onLight = { bg: "#ffffff", ink: "#17171a" }, onDark = { bg: "#17171a", ink: "#f2f2f5" };

/** el("div.cls", { style }, ...children) */
function el(spec, attrs, ...kids) {
  const [tag, ...classes] = spec.split(".");
  const node = document.createElement(tag || "div");
  if (classes.length) node.className = classes.join(" ");
  if (attrs) for (const [k, v] of Object.entries(attrs)) { if (k === "style") node.style.cssText = v; else node.setAttribute(k, v); }
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
}
const text = (cls, s, style) => el("span." + cls, style ? { style } : null, s);
const note = (s) => text("note", s);
const section = (title, grow, ...kids) => { const s = el("div.section", { style: `flex-grow:${grow}` }, el("h2", null, title.toUpperCase()), ...kids); return s; };
const col = (style, ...kids) => el("div.col", { style }, ...kids);
const row = (style, ...kids) => el("div.row", { style }, ...kids);
const icon = (name, size, tone) => el("span.ico", { style: `--src:url(../icons/${name}.svg);width:${size}px;height:${size}px;color:var(--${tone})` });

function button(label, o = {}) {
  const variant = o.variant || "plain", tone = { plain: "ink", tinted: "accent", filled: "on-accent" }[variant];
  const b = el("div.btn." + variant + (o.small ? ".small" : "") + (o.selected ? ".selected" : "") + (o.disabled ? ".disabled" : ""));
  if (o.icon) b.append(icon(o.icon, o.small ? 14 : 16, tone));
  if (label) b.append(text("label t-" + tone, label));
  return b;
}
const ibutton = (name, o = {}) => {
  const size = o.size || 32;
  return el("div.ibtn" + (o.outline ? ".outl" : "") + (o.selected ? ".selected" : "") + (o.disabled ? ".disabled" : ""), { style: `width:${size}px;height:${size}px` }, icon(name, o.iconSize || 18, "ink"));
};

/** Sample text at each size and weight. */
function typeGrid(sizes, bg, ink) {
  const g = col(`gap:2px;padding:8px;border-radius:8px;background:${bg};border:1px solid #00000018`);
  for (const size of sizes) {
    const r = row("");
    r.append(el("div", { style: "width:20px" }, text("", String(size), `font:500 10px/normal var(--font);color:${ink};opacity:.5`)));
    for (const w of [400, 500, 650, 700]) r.append(el("div", { style: "width:84px" }, text("nowrap", "Agxy 01", `font:${w} ${size}px/normal var(--font);color:${ink}`)));
    g.append(r);
  }
  return g;
}

function busy(width, height) {
  const b = el("div", { style: `position:relative;width:${width}px;height:${height}px;overflow:hidden;border-radius:8px;flex:none` });
  const tile = 14, hsl = (h, s, l) => `hsl(${h} ${s * 100}% ${l * 100}%)`;
  for (let r = 0; r < Math.ceil(height / tile); r++) for (let c = 0; c < Math.ceil(width / tile); c++) {
    b.append(el("div.abs", { style: `left:${c * tile}px;top:${r * tile}px;width:${tile}px;height:${tile}px;background:${hsl((c * 23 + r * 41) % 360, .75, .35 + ((c * 7 + r * 13) % 5) * .1)}` }));
  }
  b.append(el("div.abs", { style: `left:0;top:${height * .4}px;width:${width}px;height:4px;background:#fff` }));
  b.append(el("div.abs", { style: `left:0;top:${height * .7}px;width:${width}px;height:2px;background:#000` }));
  b.append(el("div.abs", { style: `left:${width * .55}px;top:0;width:3px;height:${height}px;background:#fff` }));
  b.append(el("span.abs.nowrap", { style: "left:8px;top:6px;font:700 11px/normal var(--font);color:#fff" }, "busy background 0123456789"));
  return b;
}

const sections = {};

sections.type = [0, () => section("Text: sizes x weights, dark on light", 210,
  row("padding-left:28px", ...[400, 500, 650, 700].map((w) => el("div", { style: "width:84px" }, note(String(w))))),
  typeGrid([10, 12, 13, 14, 16, 20], onLight.bg, onLight.ink))];

sections["type-dark"] = [0, () => section("Text: light on dark", 132, typeGrid([12, 14, 18], onDark.bg, onDark.ink))];

sections.prose = [0, () => {
  const p = "The quick brown fox jumps over the lazy dog. Sphinx of black quartz, judge my vow.";
  const para = (c) => el("div", { style: `flex:1 1 0;padding:8px;border-radius:8px;background:${c.bg}` }, text("", p, `font:400 13px/18px var(--font);color:${c.ink};display:block`));
  const ink = onLight.ink, t = (s, f) => text("nowrap", s, `font:${f} var(--font);color:${ink}`);
  return section("Text: paragraph, digits, scripts", 282,
    row("gap:8px;align-items:stretch", para(onLight), para(onDark)),
    row("gap:8px;align-items:flex-start",
      col("flex:1 1 0;gap:2px", note("digits, 20 px / 650"), t("12:34:56", "650 20px/normal"), t("00:11 23:59", "650 20px/normal")),
      col("flex:1 1 0;gap:2px", note("digits, 12 px / 500"), t("1,234,567.89  0O 1lI", "500 12px/normal"), t("-+=x/% 5S 8B 2Z", "500 12px/normal"))),
    col("gap:2px", note("mixed scripts and italics, 13 px"),
      t("Grüße, Ελληνικά, Кириллица, ñandú, ĳ", "500 13px/normal"),
      t("日本語のテキスト  한국어  हिन्दी  עברית  ภาษาไทย", "500 13px/normal"),
      el("span.nowrap", { style: `font:italic 500 13px/normal var(--font);color:${ink};display:block` }, "Italic text, and ", el("b", { style: "font-weight:700" }, "bold"), " within it")));
}];

sections.buttons = [1, () => section("Buttons", 210,
  row("gap:8px", button("Plain"), button("Tinted", { variant: "tinted" }), button("Filled", { variant: "filled" }), button("Selected", { selected: true }), button("Disabled", { variant: "filled", disabled: true })),
  row("gap:8px", button("Small", { small: true }), button("Tinted", { small: true, variant: "tinted" }), button("Filled", { small: true, variant: "filled" }),
    button("Selected", { small: true, variant: "tinted", selected: true }), button("Disabled", { small: true, disabled: true })),
  row("gap:8px", button("With icon", { icon: "music", variant: "tinted" }), button("Filled", { icon: "volume", variant: "filled" }), button("", { icon: "clipboard" })),
  row("gap:6px", ibutton("brightness"), ibutton("music", { selected: true }), ibutton("volume"), ibutton("clipboard", { disabled: true }),
    ibutton("brightness", { size: 28, iconSize: 16 }), el("div", { style: "flex:1" }), note("hover and press me")))];

function checkbox(on, label, disabled) {
  const box = el("div.box" + (on ? ".on" : ""));
  box.insertAdjacentHTML("beforeend", `<svg width="12" height="12" viewBox="0 0 24 24" style="opacity:${on ? 1 : 0}"><polyline points="4.5,12.5 9.5,17.5 19.5,6.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  return row("gap:8px", el("div.check" + (disabled ? ".disabled" : ""), null, box, text("body", label)));
}
const sw = (on, disabled) => el("div.switch" + (on ? ".on" : "") + (disabled ? ".disabled" : ""), null, el("i"));
sections.inputs = [1, () => {
  const level = 0.4, travel = 160 - 16;
  const slider = el("div.slider", null, el("div.rail"), el("div.fill", { style: `width:${Math.max(4, 8 + level * travel)}px` }), el("div.thumb", { style: `left:${level * travel}px` }));
  const seg = (label, on) => el("div.seg" + (on ? ".on" : ""), null, text("label", label));

const all = { ...sections, ...sections2 };
const pageSections = Object.fromEntries(Object.entries(sections2).filter(([id]) => (id.startsWith("kit-") ? 3 : 2) === page));
if (page !== 1) document.getElementById("toast").remove(), document.getElementById("toast-busy").remove();
if (only && all[only]) {
  grid.style.cssText = "transform:scale(2);transform-origin:0 0;width:622px;height:340px";
  grid.append(el("div.column", null, all[only][1]()));
} else {
  for (const [column, make] of Object.values(page === 1 ? sections : pageSections)) columns[column].append(make());
  columns.forEach((c) => grid.append(c));
}
if (page === 1) document.getElementById("toast-busy").append(busy(420, 48));
</script>
