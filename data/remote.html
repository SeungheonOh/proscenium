<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proscenium Remote</title>
<style>
  :root {
    --bg: #0b0c0f;
    --panel: rgba(22, 24, 30, 0.82);
    --line: rgba(255, 255, 255, 0.09);
    --text: #e8eaf0;
    --faint: #9298a8;
    --accent: #7aa2ff;
    --good: #5fd39a;
    --bad: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
               overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; outline: none; touch-action: none; background: #000;
           image-rendering: auto; }
  #bar { position: fixed; top: 10px; right: 10px; display: flex; align-items: center; gap: 6px;
         padding: 5px 6px 5px 12px; border-radius: 999px; background: var(--panel);
         border: 1px solid var(--line); backdrop-filter: blur(14px);
         transition: opacity 0.25s ease, transform 0.25s ease; z-index: 2; }
  #bar.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  #dot.live { background: var(--good); box-shadow: 0 0 8px var(--good); }
  #dot.down { background: var(--bad); }
  #status { color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  button { appearance: none; border: 0; margin: 0; width: 28px; height: 28px; border-radius: 50%;
           display: grid; place-items: center; background: transparent; color: var(--text);
           cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, 0.08); }
  button[aria-pressed="true"] { background: var(--accent); color: #0b0c0f; }
  button svg { width: 15px; height: 15px; }
  /* Stats for nerds: a translucent box over the stream's top left, monospace rows. */
  #stats { position: fixed; top: 10px; left: 10px; z-index: 2; padding: 8px 30px 8px 10px;
           max-width: calc(100vw - 20px); background: rgba(16, 16, 16, 0.78); color: #f1f1f1;
           font: 11px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
           border-radius: 4px; font-variant-numeric: tabular-nums; pointer-events: auto; }
  #stats.closed { display: none; }
  #stats .row { display: grid; grid-template-columns: 156px auto; column-gap: 10px; white-space: nowrap; }
  #stats .row > b { font-weight: 700; text-align: right; color: #fff; }
  #stats .row > span { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; }
  #stats .dim { color: #aaa; }
  #stats .graph { width: 120px; height: 13px; flex: none; }
  #stats .value { min-width: 9ch; }
  #stats .close { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 3px;
                  color: #ddd; font: inherit; font-size: 12px; }
  #stats .close:hover { background: rgba(255, 255, 255, 0.12); }
  #notice { position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
            background: var(--bg); padding: 16px; }
  #notice.shown { display: grid; }
  #notice div { max-width: 460px; text-align: center; color: var(--faint); }
  #notice h1 { font-size: 17px; color: var(--text); font-weight: 600; margin: 0 0 8px; }
  #notice a { color: var(--accent); }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" tabindex="0"></canvas></div>
<div id="bar">
  <span id="dot"></span>
  <span id="status">Connecting…</span>
  <button id="swipe" aria-pressed="false"
          title="Two-finger scrolling swipes with three fingers, as on a touchpad (browsers never see three-finger swipes)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 3v6M8 2v7M12 3v6M2 12h12M11 10l3 2-3 2"/></svg>
  </button>
  <button id="stats-toggle" aria-pressed="false" title="Stats for nerds (Ctrl+Shift+Alt+S)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 14h12M4 11V7M8 11V3M12 11V8"/></svg>
  </button>
  <button id="full" title="Fullscreen, with every key going to the remote">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>
  </button>
</div>
<div id="stats" class="closed" aria-live="off">
  <button class="close" id="s-close" title="Close (Ctrl+Shift+Alt+S)">✕</button>
  <div class="row"><b>Session</b><span id="s-session">–</span></div>
  <div class="row"><b>Encoder</b><span id="s-encoder">–</span></div>
  <div class="row"><b>Codec</b><span id="s-codec">–</span></div>
  <div class="row"><b>Stream / Shown</b><span id="s-size">–</span></div>
  <div class="row"><b>Frames</b><span id="s-frames">–</span></div>
  <div class="row"><b>Frame rate</b><span><span class="value" id="s-fps">–</span><svg class="graph" id="s-fps-graph" viewBox="0 0 120 13" preserveAspectRatio="none"></svg></span></div>
  <div class="row"><b>Frame interval</b><span id="s-interval">–</span></div>
  <div class="row"><b>Bit rate</b><span><span class="value" id="s-rate">–</span><svg class="graph" id="s-rate-graph" viewBox="0 0 120 13" preserveAspectRatio="none"></svg></span></div>
  <div class="row"><b>Received</b><span id="s-received">–</span></div>
  <div class="row"><b>Latency</b><span><span class="value" id="s-latency">–</span><svg class="graph" id="s-latency-graph" viewBox="0 0 120 13" preserveAspectRatio="none"></svg></span></div>
  <div class="row"><b>Encode / Net / Decode</b><span id="s-split">–</span></div>
  <div class="row"><b>Round trip</b><span id="s-rtt">–</span></div>
  <div class="row"><b>Decode queue</b><span id="s-queue">–</span></div>
  <div class="row"><b>Color</b><span>BT.709 limited range, 4:2:0</span></div>
  <div class="row"><b>Pointer</b><span id="s-cursor">–</span></div>
</div>
<div id="notice"><div id="notice-body"></div></div>
<script>
"use strict";

// evdev key codes by KeyboardEvent.code.
const keys = {
  Escape: 1, Digit1: 2, Digit2: 3, Digit3: 4, Digit4: 5, Digit5: 6, Digit6: 7, Digit7: 8, Digit8: 9,
  Digit9: 10, Digit0: 11, Minus: 12, Equal: 13, Backspace: 14, Tab: 15, KeyQ: 16, KeyW: 17,
  KeyE: 18, KeyR: 19, KeyT: 20, KeyY: 21, KeyU: 22, KeyI: 23, KeyO: 24, KeyP: 25, BracketLeft: 26,
  BracketRight: 27, Enter: 28, ControlLeft: 29, KeyA: 30, KeyS: 31, KeyD: 32, KeyF: 33, KeyG: 34,
  KeyH: 35, KeyJ: 36, KeyK: 37, KeyL: 38, Semicolon: 39, Quote: 40, Backquote: 41, ShiftLeft: 42,
  Backslash: 43, KeyZ: 44, KeyX: 45, KeyC: 46, KeyV: 47, KeyB: 48, KeyN: 49, KeyM: 50, Comma: 51,
  Period: 52, Slash: 53, ShiftRight: 54, NumpadMultiply: 55, AltLeft: 56, Space: 57, CapsLock: 58,
  F1: 59, F2: 60, F3: 61, F4: 62, F5: 63, F6: 64, F7: 65, F8: 66, F9: 67, F10: 68, NumLock: 69,
  ScrollLock: 70, Numpad7: 71, Numpad8: 72, Numpad9: 73, NumpadSubtract: 74, Numpad4: 75,
  Numpad5: 76, Numpad6: 77, NumpadAdd: 78, Numpad1: 79, Numpad2: 80, Numpad3: 81, Numpad0: 82,
  NumpadDecimal: 83, IntlBackslash: 86, F11: 87, F12: 88, IntlRo: 89, NumpadEnter: 96,
  ControlRight: 97, NumpadDivide: 98, PrintScreen: 99, AltRight: 100, Home: 102, ArrowUp: 103,
  PageUp: 104, ArrowLeft: 105, ArrowRight: 106, End: 107, ArrowDown: 108, PageDown: 109,
  Insert: 110, Delete: 111, NumpadEqual: 117, Pause: 119, NumpadComma: 121, IntlYen: 124,
  MetaLeft: 125, MetaRight: 126, ContextMenu: 127,
  F13: 183, F14: 184, F15: 185, F16: 186, F17: 187, F18: 188, F19: 189, F20: 190, F21: 191,
  F22: 192, F23: 193, F24: 194,
};
// BTN_LEFT, BTN_MIDDLE, BTN_RIGHT, BTN_SIDE, BTN_EXTRA by MouseEvent.button.
const buttons = [0x110, 0x112, 0x111, 0x113, 0x114];
const MOTION = 1, BUTTON = 2, SCROLL = 3, KEY = 4, RELEASE = 5, KEYFRAME = 6, SWIPE = 7, PINCH = 8, PING = 9;
const BEGIN = 0, UPDATE = 1, END = 2, CANCEL = 3;

const canvas = document.getElementById("screen");
const context = canvas.getContext("2d", { alpha: false, desynchronized: true });
const bar = document.getElementById("bar");
const dot = document.getElementById("dot");
const statusText = document.getElementById("status");

let socket = null;
let decoder = null;
let config = null;
let waitingForKey = true;
let size = { width: 0, height: 0 };
const held = new Set();
const stats = { frames: 0, bytes: 0, decodeMs: 0, decoded: 0, serverMs: 0, served: 0,
                since: performance.now() };
// Totals since connecting, the round trip, and a minute of history for the graphs.
const totals = { dropped: 0, keys: 0, frames: 0, bytes: 0, connectedAt: 0 };
// The longest gap between frames shown this second, and their sum, for the frame interval.
const gaps = { last: 0, max: 0, sum: 0, count: 0 };
let roundTrip = null;
const history = { latency: [], fps: [], rate: [] };
const sentAt = new Map();

function notice(html) {
  document.getElementById("notice-body").innerHTML = html;
  document.getElementById("notice").classList.add("shown");
}

if (!("VideoDecoder" in window)) {
  const secure = `https://${location.hostname}:${location.port || 443}/`;
  notice(window.isSecureContext
    ? "<h1>This browser cannot decode the stream</h1>It needs WebCodecs: a recent Chrome, Edge, Safari or Firefox."
    : `<h1>Open the secure address</h1>Browsers decode video only on secure pages.
       Open <a href="${secure}">${secure}</a> and accept its self-signed certificate.`);
  throw new Error("no WebCodecs");
}

// Input.

function send(type, flag, a, b, aIsInt) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  const message = new DataView(new ArrayBuffer(12));
  message.setUint8(0, type);
  message.setUint8(1, flag ? 1 : 0);
  if (aIsInt) message.setUint32(4, a >>> 0, true);
  else message.setFloat32(4, a || 0, true);
  message.setFloat32(8, b || 0, true);
  socket.send(message.buffer);
}

// A swipe or a pinch: [type][phase][fingers][0] and float fields, padded to what the server reads.
function sendGesture(type, phase, fingers, values) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  const fields = type === PINCH ? 4 : 2;
  const message = new DataView(new ArrayBuffer(4 + 4 * fields));
  message.setUint8(0, type);
  message.setUint8(1, phase);
  message.setUint8(2, fingers);
  for (let i = 0; i < fields; i++) message.setFloat32(4 + 4 * i, values[i] ?? (type === PINCH && i === 0 ? 1 : 0), true);
  socket.send(message.buffer);
}

// CSS pixels to the stream's, which gestures move in.
function toStream(dx, dy) {
  const rect = canvas.getBoundingClientRect();
  return [dx * canvas.width / (rect.width || 1), dy * canvas.height / (rect.height || 1)];
}

function point(event) {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width;
  const y = (event.clientY - rect.top) / rect.height;
  return [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))];
}

// Fingers on a touchscreen: one points and presses as a mouse does; two pinch; three or more swipe.
const touches = new Map();
let touchGesture = null;
let touchPressed = false;

function touchShape() {
  const points = [...touches.values()];
  const x = points.reduce((sum, p) => sum + p.x, 0) / points.length;
  const y = points.reduce((sum, p) => sum + p.y, 0) / points.length;
  const [a, b] = points;
  const distance = b ? Math.hypot(b.x - a.x, b.y - a.y) : 0;
  const angle = b ? Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI : 0;
  return { x, y, distance, angle, fingers: points.length };
}

function endTouchGesture(cancelled) {
  if (!touchGesture) return;
  sendGesture(touchGesture.type, cancelled ? CANCEL : END, touchGesture.fingers, []);
  touchGesture = null;
}

function startTouchGesture() {
  endTouchGesture(true);
  if (touchPressed) {
    send(BUTTON, false, buttons[0], 0, true);
    touchPressed = false;
  }
  const shape = touchShape();
  const type = shape.fingers === 2 ? PINCH : SWIPE;
  touchGesture = { type, fingers: Math.min(shape.fingers, 5), start: shape, last: shape };
  sendGesture(type, BEGIN, touchGesture.fingers, []);
}

function moveTouchGesture() {
  const shape = touchShape();
  const g = touchGesture;
  const [dx, dy] = toStream(shape.x - g.last.x, shape.y - g.last.y);
  if (g.type === PINCH) {
    let turn = shape.angle - g.last.angle;
    if (turn > 180) turn -= 360;
    if (turn < -180) turn += 360;
    sendGesture(PINCH, UPDATE, g.fingers, [shape.distance / (g.start.distance || 1), turn, dx, dy]);
  } else {
    sendGesture(SWIPE, UPDATE, g.fingers, [dx, dy]);
  }
  g.last = shape;
}

canvas.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch" && touches.has(event.pointerId)) {
    touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (touchGesture) {
      moveTouchGesture();
      return;
    }
  }
  const [x, y] = point(event);
  send(MOTION, 0, x, y);
});
canvas.addEventListener("pointerdown", (event) => {
  canvas.focus();
  canvas.setPointerCapture(event.pointerId);
  event.preventDefault();
  if (event.pointerType === "touch") {
    touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (touches.size >= 2) {
      startTouchGesture();
      return;
    }
    touchPressed = true;
  }
  const [x, y] = point(event);
  send(MOTION, 0, x, y);
  const code = buttons[event.button];
  if (code) send(BUTTON, true, code, 0, true);
});
function pointerGone(event) {
  if (event.pointerType === "touch") {
    touches.delete(event.pointerId);
    if (touchGesture) {
      // Fewer fingers end it; a pinch that gains a finger becomes a swipe.
      if (touches.size < 2) endTouchGesture(event.type === "pointercancel");
      else startTouchGesture();
      return;
    }
    if (!touchPressed) return;
    touchPressed = false;
  }
  const code = buttons[event.button];
  if (code) send(BUTTON, false, code, 0, true);
  event.preventDefault();
}
canvas.addEventListener("pointerup", pointerGone);
canvas.addEventListener("pointercancel", pointerGone);
canvas.addEventListener("contextmenu", (event) => event.preventDefault());
canvas.addEventListener("auxclick", (event) => event.preventDefault());

// Gestures made of wheel events (a touchpad's pinch; scrolling in swipe mode) end once they pause.
let wheelGesture = null;
function endWheelGesture() {
  if (!wheelGesture) return;
  clearTimeout(wheelGesture.timer);
  sendGesture(wheelGesture.type, END, wheelGesture.fingers, []);
  wheelGesture = null;
}
function wheelGestureStep(type, fingers, update) {
  if (wheelGesture && wheelGesture.type !== type) endWheelGesture();
  if (!wheelGesture) {
    wheelGesture = { type, fingers, scale: 1, timer: 0 };
    sendGesture(type, BEGIN, fingers, []);
  }
  update(wheelGesture);
  clearTimeout(wheelGesture.timer);
  wheelGesture.timer = setTimeout(endWheelGesture, 150);
}

let swipeMode = false;
try { swipeMode = localStorage.getItem("proscenium-remote-swipe") === "1"; } catch {}
const swipeButton = document.getElementById("swipe");
function showSwipeMode() { swipeButton.setAttribute("aria-pressed", String(swipeMode)); }
swipeButton.addEventListener("click", () => {
  swipeMode = !swipeMode;
  try { localStorage.setItem("proscenium-remote-swipe", swipeMode ? "1" : "0"); } catch {}
  showSwipeMode();
  canvas.focus();
});
showSwipeMode();

canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  // A touchpad's pinch arrives as a wheel with a Ctrl that is not held: a two-finger pinch.
  if (event.ctrlKey && !held.has(keys.ControlLeft) && !held.has(keys.ControlRight)) {
    wheelGestureStep(PINCH, 2, (g) => {
      g.scale *= Math.exp(-event.deltaY / 100);
      sendGesture(PINCH, UPDATE, 2, [g.scale, 0, 0, 0]);
    });
    return;
  }
  // Wheel notches as notches; a touchpad's travel as pixels.
  const wheelY = event.wheelDeltaY, wheelX = event.wheelDeltaX;
  const notched = event.deltaMode !== 0 ||
    ((wheelY && wheelY % 120 === 0 || wheelX && wheelX % 120 === 0) &&
     Math.max(Math.abs(event.deltaX), Math.abs(event.deltaY)) >= 40);
  if (swipeMode && !notched) {
    // The fingers move against the content they scroll (natural scrolling).
    wheelGestureStep(SWIPE, 3, () => sendGesture(SWIPE, UPDATE, 3, [-event.deltaX, -event.deltaY]));
    return;
  }
  if (notched) {
    const perNotch = event.deltaMode === 1 ? 3 : event.deltaMode === 2 ? 1 : null;
    const dx = perNotch ? event.deltaX / perNotch : -(wheelX || 0) / 120;
    const dy = perNotch ? event.deltaY / perNotch : -(wheelY || 0) / 120;
    send(SCROLL, true, dx, dy);
  } else {
    send(SCROLL, false, event.deltaX, event.deltaY);
  }
}, { passive: false });

// Safari reports a touchpad's pinch as gesture events, with rotation.
let safariAngle = 0;
document.addEventListener("gesturestart", (event) => {
  event.preventDefault();
  safariAngle = 0;
  sendGesture(PINCH, BEGIN, 2, []);
});
document.addEventListener("gesturechange", (event) => {
  event.preventDefault();
  sendGesture(PINCH, UPDATE, 2, [event.scale, event.rotation - safariAngle, 0, 0]);
  safariAngle = event.rotation;
});
document.addEventListener("gestureend", (event) => {
  event.preventDefault();
  sendGesture(PINCH, END, 2, []);
});

function keyEvent(event, down) {
  const code = keys[event.code];
  if (!code) return;
  event.preventDefault();
  if (down && event.repeat) return;
  if (down) held.add(code); else held.delete(code);
  send(KEY, down, code, 0, true);
}
window.addEventListener("keydown", (event) => keyEvent(event, true));
window.addEventListener("keyup", (event) => keyEvent(event, false));

function releaseAll() {
  held.clear();
  touches.clear();
  touchGesture = null;
  touchPressed = false;
  if (wheelGesture) clearTimeout(wheelGesture.timer);
  wheelGesture = null;
  send(RELEASE, 0, 0, 0);
}
window.addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

document.getElementById("full").addEventListener("click", async () => {
  if (document.fullscreenElement) {
    await document.exitFullscreen();
    return;
  }
  await document.documentElement.requestFullscreen();
  // In fullscreen, Super, Escape, Alt+Tab and the rest go to the remote, where browsers allow it.
  try { await navigator.keyboard?.lock(); } catch {}
  canvas.focus();
});

// Layout: the stream as large as the window allows, at its own aspect.

function layout() {
  if (!size.width) return;
  const scale = Math.min(innerWidth / size.width, innerHeight / size.height);
  canvas.style.width = `${Math.floor(size.width * scale)}px`;
  canvas.style.height = `${Math.floor(size.height * scale)}px`;
}
window.addEventListener("resize", layout);

// The bar hides while the pointer is away from it.
let hideTimer = 0;
function showBar() {
  bar.classList.remove("hidden");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (dot.classList.contains("live")) bar.classList.add("hidden");
  }, 2500);
}
window.addEventListener("pointermove", (event) => { if (event.clientY < 60) showBar(); });

// The stream details panel, toggled from the bar and remembered.
const panel = document.getElementById("stats");
const statsButton = document.getElementById("stats-toggle");
let statsOpen = false;
try { statsOpen = localStorage.getItem("proscenium-remote-stats") === "1"; } catch {}
function showStatsPanel() {
  panel.classList.toggle("closed", !statsOpen);
  statsButton.setAttribute("aria-pressed", String(statsOpen));
}
function toggleStats() {
  statsOpen = !statsOpen;
  try { localStorage.setItem("proscenium-remote-stats", statsOpen ? "1" : "0"); } catch {}
  showStatsPanel();
  canvas.focus();
}
statsButton.addEventListener("click", toggleStats);
document.getElementById("s-close").addEventListener("click", toggleStats);
// Ctrl+Shift+Alt+S stays here: it toggles the stats and never reaches the session.
window.addEventListener("keydown", (event) => {
  if (event.code === "KeyS" && event.ctrlKey && event.shiftKey && event.altKey) {
    event.preventDefault();
    event.stopImmediatePropagation();
    toggleStats();
  }
}, { capture: true });
const $ = (id) => document.getElementById(id);

// A minute of samples as thin bars, newest at the right, as YouTube draws them.
function bars(svg, values, color, floor) {
  const max = Math.max(floor, ...values);
  const width = 120 / 60;
  svg.innerHTML = values.map((v, i) => {
    const h = Math.max(0.5, v / max * 13);
    const x = 120 - (values.length - i) * width;
    return `<rect x="${x.toFixed(1)}" y="${(13 - h).toFixed(1)}" width="${(width - 0.4).toFixed(1)}" height="${h.toFixed(1)}" fill="${color}"/>`;
  }).join("");
}

const PROFILES = { 0x42: "Baseline", 0x4d: "Main", 0x58: "Extended", 0x64: "High" };
function describeCodec(codec) {
  const m = /^avc1\.([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(codec || "");
  if (!m) return codec || "–";
  const profile = parseInt(m[1], 16), flags = parseInt(m[2], 16), level = parseInt(m[3], 16);
  let name = PROFILES[profile] || `profile ${profile}`;
  if (profile === 0x42 && flags & 0x40) name = "Constrained Baseline";
  return `${codec} <span class="dim">(H.264 ${name}, level ${(level / 10).toFixed(1)})</span>`;
}

function duration(seconds) {
  const s = Math.floor(seconds % 60), m = Math.floor(seconds / 60) % 60, h = Math.floor(seconds / 3600);
  return h ? `${h}h${String(m).padStart(2, "0")}m` : m ? `${m}m${String(s).padStart(2, "0")}s` : `${s}s`;
}

function bytes(n) {
  return n > 1e9 ? `${(n / 1e9).toFixed(2)} GB` : n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.round(n / 1e3)} KB`;
}

function renderStats(state, sample) {
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
  const up = totals.connectedAt ? ` <span class="dim">· up ${duration((performance.now() - totals.connectedAt) / 1000)}</span>` : "";
  $("s-session").innerHTML = `${url} <span class="dim">·</span> ${state === "live" ? "live" : state === "down" ? "disconnected" : "connecting"}${state === "live" ? up : ""}`;
  if (!sample) return;
  const network = roundTrip === null ? null : roundTrip / 2;
  const known = [sample.server, network, sample.decode].filter((v) => v !== null);
  const latency = known.length ? known.reduce((a, b) => a + b, 0) : null;
  const ms = (v) => v === null ? "–" : `${v < 10 ? v.toFixed(1) : Math.round(v)} ms`;
  if (config) {
    const hardware = /vaapi|nvenc|v4l2m2m|qsv|vulkan|videotoolbox/.test(config.encoder);
    $("s-encoder").innerHTML = `${config.encoder} <span class="dim">(${hardware ? "hardware" : "software"})</span>`;
    $("s-codec").innerHTML = describeCodec(config.codec);
    const rect = canvas.getBoundingClientRect();
    const dpr = devicePixelRatio || 1;
    $("s-size").textContent = `${config.width}x${config.height} / ${Math.round(rect.width * dpr)}x${Math.round(rect.height * dpr)}@${dpr}x`;
  }
  $("s-frames").textContent = `${totals.frames} shown / ${totals.dropped} dropped / ${totals.keys} keyframes`;
  $("s-fps").textContent = `${sample.fps} fps`;
  $("s-interval").textContent = sample.gapAvg === null ? "– (still)" : `avg ${sample.gapAvg.toFixed(1)} ms · max ${Math.round(sample.gapMax)} ms`;
  $("s-rate").textContent = `${sample.mbps >= 10 ? sample.mbps.toFixed(0) : sample.mbps.toFixed(2)} Mb/s`;
  $("s-received").textContent = bytes(totals.bytes);
  $("s-latency").textContent = latency === null ? "–" : `${Math.round(latency)} ms`;
  $("s-split").textContent = `${ms(sample.server)} / ${ms(network)} / ${ms(sample.decode)}`;
  $("s-rtt").textContent = ms(roundTrip);
  $("s-queue").textContent = decoder && decoder.state === "configured" ? `${decoder.decodeQueueSize} chunks` : "–";
  $("s-cursor").textContent = canvas.style.cursor || "default";
  if (latency !== null) history.latency.push(latency);
  history.fps.push(sample.fps);
  history.rate.push(sample.mbps);
  for (const list of Object.values(history)) while (list.length > 60) list.shift();
  bars($("s-fps-graph"), history.fps, "#3ea6ff", 30);
  bars($("s-rate-graph"), history.rate, "#ff4e45", 1);
  bars($("s-latency-graph"), history.latency, "#ffd23f", 30);
}

// Video.

function onFrame(frame) {
  const started = sentAt.get(frame.timestamp);
  if (started !== undefined) {
    stats.decodeMs += performance.now() - started;
    stats.decoded++;
    sentAt.delete(frame.timestamp);
  }
  context.drawImage(frame, 0, 0);
  frame.close();
  stats.frames++;
  totals.frames++;
  const now = performance.now();
  if (gaps.last) {
    const gap = now - gaps.last;
    // A pause of a second or more is a still screen, not a slow frame.
    if (gap < 1000) {
      gaps.max = Math.max(gaps.max, gap);
      gaps.sum += gap;
      gaps.count++;
    }
  }
  gaps.last = now;
}

function needKey() {
  waitingForKey = true;
  send(KEYFRAME, 0, 0, 0);
}

function configure(next) {
  config = next;
  if (decoder && decoder.state !== "closed") decoder.close();
  decoder = new VideoDecoder({
    output: onFrame,
    error: (error) => {
      console.warn("decoder:", error);
      configure(config);
      needKey();
    },
  });
  decoder.configure({ codec: next.codec, optimizeForLatency: true });
  if (size.width !== next.width || size.height !== next.height) {
    size = { width: next.width, height: next.height };
    canvas.width = next.width;
    canvas.height = next.height;
    layout();
  }
  waitingForKey = true;
}

function onVideo(data) {
  const bytes = new Uint8Array(data);
  const key = bytes[1] === 1;
  stats.bytes += bytes.length;
  totals.bytes += bytes.length;
  // How long the frame spent in the compositor: queued, converted and encoded.
  const server = (bytes[2] | bytes[3] << 8) / 10;
  if (server > 0) {
    stats.serverMs += server;
    stats.served++;
  }
  if (key) totals.keys++;
  if (!decoder || decoder.state !== "configured") return;
  if (waitingForKey && !key) {
    totals.dropped++;
    return;
  }
  // Decoding fell behind: drop to the next keyframe rather than show the past.
  if (!key && decoder.decodeQueueSize > 2) {
    totals.dropped++;
    needKey();
    return;
  }
  waitingForKey = false;
  const timestamp = Math.round(new DataView(data).getFloat64(4, true) * 1000);
  sentAt.set(timestamp, performance.now());
  if (sentAt.size > 120) sentAt.delete(sentAt.keys().next().value);
  decoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp, data: bytes.subarray(12) }));
}

function onText(text) {
  const message = JSON.parse(text);
  if (message.type === "config") configure(message);
  else if (message.type === "cursor") canvas.style.cursor = message.name;
  else if (message.type === "pong" && pings.has(message.id)) {
    const rtt = performance.now() - pings.get(message.id);
    pings.delete(message.id);
    roundTrip = roundTrip === null ? rtt : roundTrip * 0.7 + rtt * 0.3;
  }
}

// A ping a second measures the round trip.
const pings = new Map();
let pingId = 0;
setInterval(() => {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  pingId = (pingId + 1) >>> 0;
  pings.set(pingId, performance.now());
  if (pings.size > 10) pings.delete(pings.keys().next().value);
  send(PING, 0, pingId, 0, true);
}, 1000);

function setStatus(state, text) {
  dot.className = state;
  statusText.textContent = text;
  if (state !== "live") showBar();
  if (state !== "live") renderStats(state, null);
}

// Each second: a short line in the bar, and the panel's numbers. A still screen sends no frames,
// so the last measured encode and decode times stay until frames come again.
let lastServer = null, lastDecode = null;
setInterval(() => {
  if (!socket || socket.readyState !== WebSocket.OPEN || !config) return;
  const seconds = (performance.now() - stats.since) / 1000;
  const fps = Math.round(stats.frames / seconds);
  const mbps = stats.bytes * 8 / seconds / 1e6;
  if (stats.served) lastServer = stats.serverMs / stats.served;
  if (stats.decoded) lastDecode = stats.decodeMs / stats.decoded;
  const sample = { fps, mbps, server: lastServer, decode: lastDecode,
                   gapAvg: gaps.count ? gaps.sum / gaps.count : null, gapMax: gaps.max };
  Object.assign(gaps, { max: 0, sum: 0, count: 0 });
  const total = [lastServer, roundTrip === null ? null : roundTrip / 2, lastDecode]
    .filter((v) => v !== null).reduce((a, b) => a + b, 0);
  setStatus("live", `${config.width}×${config.height} · ${fps} fps · ~${Math.round(total)} ms`);
  renderStats("live", sample);
  Object.assign(stats, { frames: 0, bytes: 0, decodeMs: 0, decoded: 0, serverMs: 0, served: 0,
                         since: performance.now() });
}, 1000);

function connect() {
  setStatus("", "Connecting…");
  socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  socket.binaryType = "arraybuffer";
  socket.onopen = () => {
    Object.assign(totals, { dropped: 0, keys: 0, frames: 0, bytes: 0, connectedAt: performance.now() });
    setStatus("live", "Waiting for the first frame…");
    canvas.focus();
  };
  socket.onmessage = (event) => {
    if (typeof event.data === "string") onText(event.data);
    else onVideo(event.data);
  };
  socket.onclose = () => {
    setStatus("down", "Disconnected; retrying…");
    roundTrip = null;
    pings.clear();
    held.clear();
    config = null;
    if (decoder && decoder.state !== "closed") decoder.close();
    decoder = null;
    setTimeout(connect, 1000);
  };
}

showBar();
showStatsPanel();
connect();
</script>
</body>
</html>
